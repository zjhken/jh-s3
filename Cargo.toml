[package]
name = "jh-s3"
version = "0.6.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "S3 protocol client in Rust"
homepage = "https://github.com/zjhken/jh-s3"
repository = "https://github.com/zjhken/jh-s3"
readme = "README.md"

[dependencies]
anyhow_ext = "0.2.1"
async-std = "1.12.0"
chrono = "0.4.38"
concat-string = "1.0.1"
derive_builder = "0.20.0"
hex = "0.4.3"
rust-crypto = "0.2.36"
serde = { version = "1.0.202", features = ["derive"] }
serde-xml-rs = "0.6.0"
toml = "0.8.19"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
url-escape = "0.1.1"
# zjhttpc = {path = "../zjhttpc"}
zjhttpc = "0.10.1"

[dev-dependencies]
tempfile = "3.21.0"
tracing-test = "0.2.4"
